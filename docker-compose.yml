# LOCAL-ONLY — runs the whole app on your machine. Not used by Render/Vercel.
#   docker compose up --build
#   App:           http://localhost:5173
#   API:           http://localhost:8080/v1
#   MinIO console: http://localhost:9001  (minioadmin / minioadmin) — stands in for S3 locally
# All values below are throwaway local values, not production secrets.
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]

  # Creates the bucket the app uploads to and lets the browser read the images.
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/projects012;
      mc anonymous set download local/projects012;
      exit 0;
      "

  backend:
    build: ./backend
    depends_on: [mongo, minio-init]
    ports: ["8080:8080"]
    environment:
      PORT: "8080"
      MONGO_URL: mongodb://mongo:27017/dreamstay
      SECRET_KEY: local-dev-secret-change-me
      AWS: minioadmin
      AWS_SK: minioadmin
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: projects012
      CLOUD_DOMAIN: http://localhost:9000/projects012
      MAILER_ID: ""
      MAILER_PASS: ""

  frontend:
    build:
      context: ./frontend
      args:
        VITE_B_URL: http://localhost:8080/v1
    depends_on: [backend]
    ports: ["5173:80"]

volumes:
  mongo-data:
  minio-data:
